<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MQTT Publish Subscribe OLED 預期狀態</title><desc id="desc">顯示訂閱成功、發布成功與命令拒絕，全部不是實機結果。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">MQTT PUB / SUB - EXPECTED OLED STATES</text>
  <g font-family="monospace" fill="#e0f2fe"><g transform="translate(45 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="5"/><text x="24" y="44" font-size="24">MQTT PUB / SUB</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="44">SUB OK</text><text x="24" y="210" font-size="23">EXACT CMD TOPIC</text><text x="24" y="290" font-size="24">QOS 1</text></g>
  <g transform="translate(430 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/><text x="24" y="44" font-size="24">MQTT PUB / SUB</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="44">PUB OK</text><text x="24" y="210" font-size="26">NO RETAIN</text><text x="24" y="290" font-size="24">SEQ 8 QOS 1</text></g>
  <g transform="translate(815 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#ef4444" stroke-width="5"/><text x="24" y="44" font-size="24">MQTT PUB / SUB</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="30">CMD REJECT</text><text x="24" y="210" font-size="22">PAYLOAD TOO LARGE</text><text x="24" y="290" font-size="24">ACK QOS 1</text></g></g>
  <rect y="520" width="1200" height="100" fill="#9a3412"/><text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">非實機／非實測資料</text><text x="600" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffedd5">EXPECTED STATES ONLY - TOPIC, ACL AND PACKETS REQUIRE LIVE TESTING</text>
</svg>
