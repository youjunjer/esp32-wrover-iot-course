<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ThingSpeak OLED 預期狀態</title><desc id="desc">顯示 SEND、HTTP 200 ENTRY 與 NO DATA 三種預期畫面，全部不是實機資料。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">THINGSPEAK - EXPECTED OLED STATES</text>
  <g font-family="monospace" fill="#e0f2fe"><g transform="translate(45 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#f59e0b" stroke-width="5"/><text x="24" y="44" font-size="24">THINGSPEAK</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="44">SEND</text><text x="24" y="210" font-size="28">TLS VERIFY</text><text x="24" y="290" font-size="24">KEY HIDDEN</text></g>
  <g transform="translate(430 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/><text x="24" y="44" font-size="24">THINGSPEAK</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="38">HTTP 200</text><text x="24" y="210" font-size="28">ENTRY 123</text><text x="24" y="290" font-size="23">SEQ 4 NEXT 30s</text></g>
  <g transform="translate(815 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#ef4444" stroke-width="5"/><text x="24" y="44" font-size="24">THINGSPEAK</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="40">NO DATA</text><text x="24" y="210" font-size="22">DHT/LIGHT INVALID</text><text x="24" y="290" font-size="23">UPLOAD BLOCKED</text></g></g>
  <rect y="520" width="1200" height="100" fill="#9a3412"/><text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">非實機／非實測資料</text><text x="600" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffedd5">EXPECTED LAYOUT ONLY - ENTRY ID AND SENSOR VALUES ARE ILLUSTRATIVE</text>
</svg>
