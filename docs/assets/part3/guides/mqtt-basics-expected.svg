<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MQTT 基礎 OLED 預期狀態</title><desc id="desc">顯示 TLS CONNECT、MQTT ONLINE 與 TLS ERR，全部不是實機結果。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">MQTT BASICS TLS - EXPECTED OLED STATES</text>
  <g font-family="monospace" fill="#e0f2fe"><g transform="translate(45 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#f59e0b" stroke-width="5"/><text x="24" y="44" font-size="23">MQTT BASICS TLS</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="36">TLS CONNECT</text><text x="24" y="210" font-size="25">VERIFY BROKER</text><text x="24" y="290" font-size="24">PORT 8883</text></g>
  <g transform="translate(430 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/><text x="24" y="44" font-size="23">MQTT BASICS TLS</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="32">MQTT ONLINE</text><text x="24" y="210" font-size="25">QOS1 STATUS</text><text x="24" y="290" font-size="24">LWT + RETAIN</text></g>
  <g transform="translate(815 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#ef4444" stroke-width="5"/><text x="24" y="44" font-size="23">MQTT BASICS TLS</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="42">TLS ERR</text><text x="24" y="210" font-size="22">CA/TIME/NETWORK</text><text x="24" y="290" font-size="24">RETRY LATER</text></g></g>
  <rect y="520" width="1200" height="100" fill="#9a3412"/><text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">非實機／非實測資料</text><text x="600" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffedd5">EXPECTED STATES ONLY - NO BROKER OR TLS RESULT IS IMPLIED</text>
</svg>
