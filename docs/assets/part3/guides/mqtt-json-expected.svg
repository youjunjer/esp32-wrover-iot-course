<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MQTT JSON OLED 預期狀態</title><desc id="desc">顯示上線、JSON 發布成功與感測資料過期，全部不是實機資料。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700">MQTT JSON SENSOR - EXPECTED OLED STATES</text>
  <g font-family="monospace" fill="#e0f2fe"><g transform="translate(45 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="5"/><text x="24" y="44" font-size="22">MQTT JSON SENSOR</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="32">MQTT ONLINE</text><text x="24" y="210" font-size="24">JSON SCHEMA V1</text><text x="24" y="290" font-size="24">QOS 1</text></g>
  <g transform="translate(430 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/><text x="24" y="44" font-size="22">MQTT JSON SENSOR</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="44">PUB OK</text><text x="24" y="210" font-size="22">T 26.4 H 63 L 2048</text><text x="24" y="290" font-size="24">116 B SEQ 7</text></g>
  <g transform="translate(815 90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#ef4444" stroke-width="5"/><text x="24" y="44" font-size="22">MQTT JSON SENSOR</text><line x1="24" y1="61" x2="316" y2="61" stroke="#e0f2fe"/><text x="24" y="130" font-size="44">STALE</text><text x="24" y="210" font-size="23">PUBLISH BLOCKED</text><text x="24" y="290" font-size="24">CHECK SENSOR</text></g></g>
  <rect y="520" width="1200" height="100" fill="#9a3412"/><text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">非實機／非實測資料</text><text x="600" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffedd5">EXPECTED LAYOUT ONLY - SENSOR VALUES AND JSON SIZE ARE ILLUSTRATIVE</text>
