<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Open-Meteo 空氣品質取得、成功與 JSON 錯誤 OLED 預期畫面</title>
  <desc id="desc">三個 OLED 示意畫面顯示 JSON 有界讀取、Open-Meteo CAMS 的 PM2.5、PM10 與 European AQI，以及單位驗證失敗。所有資料均非實測或即時 API 結果。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">OPEN-METEO AQI OLED - EXPECTED STATES</text>
  <g font-family="monospace" fill="#e0f2fe" stroke="#e0f2fe">
    <g transform="translate(45,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <text x="24" y="44" font-size="24" stroke="none">AIR QUALITY</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="130" font-size="37" font-weight="700" stroke="none">JSON READ</text>
      <text x="24" y="210" font-size="24" stroke="none">BODY 842/2048</text>
      <text x="24" y="285" font-size="21" stroke="none">READ BY LOOP</text>
    </g>
    <g transform="translate(430,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/>
      <text x="24" y="44" font-size="23" stroke="none">OPEN-METEO/CAMS</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="105" font-size="29" font-weight="700" stroke="none">EAQI 42</text>
      <text x="24" y="155" font-size="22" stroke="none">PM2.5 12.0 ug/m3</text>
      <text x="24" y="205" font-size="22" stroke="none">PM10 18.4 ug/m3</text>
      <text x="24" y="255" font-size="18" stroke="none">SRC 2026-09-08T14:00</text>
      <text x="24" y="305" font-size="18" stroke="none">AGE 5m NEXT 900s</text>
    </g>
    <g transform="translate(815,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#fb7185" stroke-width="5"/>
      <text x="24" y="44" font-size="24" stroke="none">AIR QUALITY</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="125" font-size="35" font-weight="700" fill="#fecdd3" stroke="none">UNIT ERR</text>
      <text x="24" y="205" font-size="23" stroke="none">EXPECTED API UNIT</text>
      <text x="24" y="285" font-size="20" stroke="none">RETRY 60s ERR 1</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155"><text x="215" y="478" text-anchor="middle">bounded body read in loop</text><text x="600" y="478" text-anchor="middle">CAMS model and EAQI are explicit</text><text x="985" y="478" text-anchor="middle">invalid data is never shown as zero</text></g>
  <rect x="0" y="520" width="1200" height="100" fill="#9a3412"/>
  <text x="600" y="558" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="700" fill="#fff">非實機／非實測資料</text>
  <text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffedd5">EXPECTED LAYOUT ONLY - PM2.5, EU AQI, AGE AND RETRY VALUES ARE NOT LIVE API DATA</text>
</svg>
