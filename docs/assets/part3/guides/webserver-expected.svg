<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 WebServer 連線、就緒與斷線 OLED 預期畫面</title>
  <desc id="desc">三個 OLED 示意畫面使用 05_webserver_oled 實際輸出字串：WEB GPIO13、WIFI CONNECT 與 TIME LEFT 12s；WEB READY、esp32-team01.local、OUTPUT ON 與 CMD OK ON 200；NET LOST、RETRY 6s 與 SAFE OFF。所有狀態均非實測。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">WEBSERVER OLED - EXPECTED STATES</text>
  <g font-family="monospace" fill="#e0f2fe" stroke="#e0f2fe">
    <g transform="translate(45,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <text x="24" y="44" font-size="24" stroke="none">WEB GPIO13</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="130" font-size="31" font-weight="700" stroke="none">WIFI CONNECT</text>
      <text x="24" y="210" font-size="27" stroke="none">TIME LEFT 12s</text>
      <text x="24" y="290" font-size="29" stroke="none">SAFE OFF</text>
    </g>
    <g transform="translate(430,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/>
      <text x="24" y="44" font-size="24" stroke="none">WEB GPIO13</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="120" font-size="35" font-weight="700" stroke="none">WEB READY</text>
      <text x="24" y="180" font-size="20" stroke="none">esp32-team01.local</text>
      <text x="24" y="240" font-size="27" stroke="none">OUTPUT ON</text>
      <text x="24" y="300" font-size="22" stroke="none">CMD OK ON 200</text>
    </g>
    <g transform="translate(815,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#fb7185" stroke-width="5"/>
      <text x="24" y="44" font-size="24" stroke="none">WEB GPIO13</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="135" font-size="42" font-weight="700" fill="#fecdd3" stroke="none">NET LOST</text>
      <text x="24" y="215" font-size="30" stroke="none">RETRY 6s</text>
      <text x="24" y="290" font-size="29" stroke="none">SAFE OFF</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155"><text x="215" y="478" text-anchor="middle">bounded Wi-Fi connection wait</text><text x="600" y="478" text-anchor="middle">valid POST command accepted</text><text x="985" y="478" text-anchor="middle">network loss forces output off</text></g>
  <rect x="0" y="520" width="1200" height="100" fill="#9a3412"/>
  <text x="600" y="558" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="700" fill="#fff">非實機／非實測資料</text>
  <text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffedd5">EXPECTED LAYOUT ONLY - HOSTNAME, OUTPUT, HTTP CODE AND RETRY VALUES ARE ILLUSTRATIVE</text>
</svg>
