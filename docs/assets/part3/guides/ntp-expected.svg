<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">NTP 同步、成功與資料過期 OLED 預期畫面</title>
  <desc id="desc">三個 OLED 示意畫面使用程式中的 NTP CLOCK UTC+8 表頭，以及 NTP SYNC、TIME OK 與 NTP STALE 狀態；日期、時間與同步秒數均非實測。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">NTP OLED - EXPECTED STATES</text>
  <g font-family="monospace" fill="#e0f2fe" stroke="#e0f2fe">
    <g transform="translate(45,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <text x="24" y="44" font-size="20" stroke="none">NTP CLOCK UTC+8</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="130" font-size="40" font-weight="700" stroke="none">NTP SYNC</text>
      <text x="24" y="210" font-size="30" stroke="none">LEFT 9s</text>
      <text x="24" y="290" font-size="20" stroke="none">TZ CST-8 = UTC+8</text>
    </g>
    <g transform="translate(430,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/>
      <text x="24" y="44" font-size="20" stroke="none">NTP CLOCK UTC+8</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="115" font-size="34" font-weight="700" stroke="none">TIME OK</text>
      <text x="24" y="185" font-size="43" stroke="none">14:35:26</text>
      <text x="24" y="245" font-size="27" stroke="none">2026-09-08</text>
      <text x="24" y="305" font-size="21" stroke="none">SYNC 0s NET ON</text>
    </g>
    <g transform="translate(815,90)">
      <rect width="340" height="350" rx="14" fill="#020617" stroke="#fb7185" stroke-width="5"/>
      <text x="24" y="44" font-size="20" stroke="none">NTP CLOCK UTC+8</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/>
      <text x="24" y="115" font-size="34" font-weight="700" fill="#fecdd3" stroke="none">NTP STALE</text>
      <text x="24" y="185" font-size="43" stroke="none">14:32:10</text>
      <text x="24" y="245" font-size="27" stroke="none">2026-09-08</text>
      <text x="24" y="305" font-size="19" stroke="none">SYNC 5400s NET ON</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155"><text x="215" y="478" text-anchor="middle">bounded synchronization countdown</text><text x="600" y="478" text-anchor="middle">validated network time</text><text x="985" y="478" text-anchor="middle">old time is labeled stale</text></g>
  <rect x="0" y="520" width="1200" height="100" fill="#9a3412"/>
  <text x="600" y="558" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="700" fill="#fff">非實機／非實測資料</text>
  <text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffedd5">EXPECTED LAYOUT ONLY - DATE, TIME, COUNTDOWN AND SYNC VALUES ARE ILLUSTRATIVE</text>
</svg>
