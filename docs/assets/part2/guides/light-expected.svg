<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">光敏模組校正前後 OLED 預期畫面</title>
  <desc id="desc">左側示意預設UNCAL畫面，右側示意完成本機校正後的DARK畫面，所有數字不是實測資料。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">LIGHT SENSOR OLED - CALIBRATE FIRST</text>
  <g font-family="monospace" fill="#e0f2fe" stroke="#e0f2fe">
    <g transform="translate(75,90)">
      <rect width="480" height="360" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <text x="26" y="44" font-size="24" stroke="none">LIGHT GPIO33</text><line x1="26" y1="61" x2="454" y2="61" stroke-width="2"/>
      <text x="26" y="115" font-size="28" stroke="none">RAW 2048</text>
      <text x="26" y="180" font-size="50" font-weight="700" stroke="none">UNCAL</text>
      <text x="26" y="235" font-size="23" stroke="none">MIN 920 MAX 3010</text>
      <rect x="26" y="276" width="428" height="30" fill="none" stroke-width="3"/><rect x="32" y="282" width="210" height="18" fill="#e0f2fe" stroke="none"/>
    </g>
    <g transform="translate(645,90)">
      <rect width="480" height="360" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <text x="26" y="44" font-size="24" stroke="none">LIGHT GPIO33</text><line x1="26" y1="61" x2="454" y2="61" stroke-width="2"/>
      <text x="26" y="115" font-size="28" stroke="none">RAW 3200</text>
      <text x="26" y="180" font-size="50" font-weight="700" stroke="none">DARK</text>
      <text x="26" y="235" font-size="23" stroke="none">MIN 920 MAX 3200</text>
      <rect x="26" y="276" width="428" height="30" fill="none" stroke-width="3"/><rect x="32" y="282" width="333" height="18" fill="#e0f2fe" stroke="none"/>
    </g>
  </g>
  <g font-family="Arial, sans-serif" fill="#334155">
    <text x="315" y="480" text-anchor="middle" font-size="20" font-weight="700">DEFAULT: NO LEVEL CLAIM</text>
    <text x="315" y="512" text-anchor="middle" font-size="18">1. observe RAW, MIN and MAX</text>
    <text x="885" y="480" text-anchor="middle" font-size="20" font-weight="700">AFTER LOCAL CALIBRATION</text>
    <text x="885" y="512" text-anchor="middle" font-size="18">2. set thresholds, then enable calibration</text>
  </g>
  <rect x="0" y="540" width="1200" height="80" fill="#b45309"/>
  <text x="600" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">EXPECTED LAYOUT - NOT A REAL OLED OR LIGHT MEASUREMENT</text>
  <text x="600" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffedd5">RAW VALUES AND LEVELS ARE ILLUSTRATIVE, NOT LUX OR MEASURED DATA</text>
</svg>
