<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wrover OLED 與 HC-SR04 安全分壓接線</title>
  <desc id="desc">OLED 使用 GPIO21 與 GPIO22。HC-SR04 TRIG 接 GPIO25，ECHO 經 1% 10kΩ 上臂與 1% 15kΩ 下臂分壓後接 GPIO14，模組使用 5V 並共地；5.0V 名目約 3.00V 且仍須量測。</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">HC-SR04 + OLED WIRING - GENERAL MODE</text>
  <rect x="55" y="100" width="350" height="505" rx="26" fill="#0f172a"/>
  <text x="230" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">ESP32 Wrover</text>
  <text x="230" y="181" text-anchor="middle" font-family="monospace" font-size="17" fill="#cbd5e1">3.3V logic inputs</text>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff"><text x="295" y="245">3V3</text><text x="305" y="300">5V</text><text x="295" y="355">GND</text><text x="250" y="410">GPIO 21</text><text x="250" y="465">GPIO 22</text><text x="250" y="520">GPIO 25</text><text x="250" y="575">GPIO 14</text></g>
  <g fill="#e2e8f0"><circle cx="405" cy="238" r="8"/><circle cx="405" cy="293" r="8"/><circle cx="405" cy="348" r="8"/><circle cx="405" cy="403" r="8"/><circle cx="405" cy="458" r="8"/><circle cx="405" cy="513" r="8"/><circle cx="405" cy="568" r="8"/></g>
  <rect x="790" y="78" width="350" height="205" rx="22" fill="#111827" stroke="#2563eb" stroke-width="4"/>
  <text x="965" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">SSD1306 OLED</text>
  <g font-family="monospace" font-size="20" fill="#dbeafe"><text x="825" y="164">VCC ← 3.3V</text><text x="825" y="196">GND ← GND</text><text x="825" y="228">SDA ← GPIO21</text><text x="825" y="260">SCL ← GPIO22</text></g>
  <rect x="745" y="325" width="420" height="280" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <circle cx="855" cy="405" r="52" fill="#cbd5e1" stroke="#475569" stroke-width="4"/><circle cx="1045" cy="405" r="52" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
  <circle cx="855" cy="405" r="34" fill="#94a3b8"/><circle cx="1045" cy="405" r="34" fill="#94a3b8"/>
  <text x="950" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">HC-SR04</text>
  <text x="775" y="525" font-family="monospace" font-size="19" fill="#1e3a8a">TRIG ───────── GPIO25</text>
  <text x="775" y="560" font-family="monospace" font-size="18" fill="#1e3a8a">ECHO ─ 1% 10kΩ ─●─ GPIO14</text>
  <text x="775" y="592" font-family="monospace" font-size="16" fill="#1e3a8a">DIVIDER NODE ● ─ 1% 15kΩ ─ GND</text>
  <text x="950" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">5.0V NOMINAL ≈ 3.00V — MEASURE FIRST</text>
  <path d="M413 238 C590 238 690 143 782 143" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M413 348 C590 348 690 196 782 196" fill="none" stroke="#111827" stroke-width="6"/><path d="M413 403 C620 403 710 228 782 228" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M413 458 C650 458 720 260 782 260" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <path d="M413 293 C590 293 630 512 737 512" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M413 348 C590 348 635 495 737 495" fill="none" stroke="#111827" stroke-width="6"/><path d="M413 513 C560 513 635 525 737 525" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M413 568 C560 568 635 560 737 560" fill="none" stroke="#f97316" stroke-width="6"/>
  <rect x="0" y="640" width="1200" height="80" fill="#b45309"/><text x="600" y="671" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">DO NOT CONNECT A 5V ECHO DIRECTLY TO GPIO14 - USE DIVIDER OR LEVEL SHIFTER</text><text x="600" y="701" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffedd5">TRIG GPIO25 / SAFE ECHO GPIO14 / ALL GROUNDS COMMON</text>
</svg>
