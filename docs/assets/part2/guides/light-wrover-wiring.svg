<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wrover OLED 與光敏模組 GPIO33 接線</title>
  <desc id="desc">OLED與光敏模組都由3.3伏特供電，光敏AO接GPIO33，DO不接，所有裝置共地。</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">LIGHT SENSOR + OLED - GENERAL MODE</text>

  <rect x="70" y="105" width="380" height="500" rx="26" fill="#0f172a"/>
  <text x="260" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">ESP32 Wrover</text>
  <text x="260" y="188" text-anchor="middle" font-family="monospace" font-size="17" fill="#cbd5e1">ADC1 input on GPIO33</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">
    <text x="325" y="275">3V3</text><text x="325" y="345">GND</text>
    <text x="290" y="415">GPIO 21</text><text x="290" y="485">GPIO 22</text><text x="290" y="555">GPIO 33</text>
  </g>
  <g fill="#e2e8f0">
    <circle cx="450" cy="268" r="8"/><circle cx="450" cy="338" r="8"/><circle cx="450" cy="408" r="8"/>
    <circle cx="450" cy="478" r="8"/><circle cx="450" cy="548" r="8"/>
  </g>

  <rect x="800" y="88" width="330" height="220" rx="22" fill="#111827" stroke="#2563eb" stroke-width="4"/>
  <text x="965" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">SSD1306 OLED</text>
  <g font-family="monospace" font-size="20" fill="#dbeafe">
    <text x="840" y="178">VCC  ← 3.3V</text><text x="840" y="211">GND  ← GND</text>
    <text x="840" y="244">SDA  ← GPIO21</text><text x="840" y="277">SCL  ← GPIO22</text>
  </g>

  <rect x="745" y="340" width="410" height="280" rx="26" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
  <circle cx="950" cy="410" r="38" fill="#fde68a" stroke="#92400e" stroke-width="4"/>
  <path d="M950 359V330M950 490V461M899 410H870M1030 410H1001M914 374L893 353M1007 467L986 446M986 374L1007 353M893 467L914 446" stroke="#f59e0b" stroke-width="7"/>
  <text x="950" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7c2d12">LIGHT MODULE</text>
  <g font-family="monospace" font-size="19" fill="#7c2d12">
    <text x="775" y="535">VCC ← 3.3V</text><text x="775" y="570">GND ← GND</text>
    <text x="775" y="605">AO  ← GPIO33</text><text x="965" y="605">DO ← NOT USED</text>
  </g>

  <path d="M458 268 C610 268 690 155 792 155" fill="none" stroke="#ef4444" stroke-width="6"/>
  <path d="M458 338 C610 338 680 211 792 211" fill="none" stroke="#111827" stroke-width="6"/>
  <path d="M458 408 C610 408 690 244 792 244" fill="none" stroke="#22c55e" stroke-width="6"/>
  <path d="M458 478 C650 478 720 277 792 277" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <path d="M458 268 C610 268 650 530 737 530" fill="none" stroke="#ef4444" stroke-width="6"/>
  <path d="M458 338 C610 338 650 565 737 565" fill="none" stroke="#111827" stroke-width="6"/>
  <path d="M458 548 C610 548 650 600 737 600" fill="none" stroke="#ea580c" stroke-width="6"/>

  <rect x="0" y="640" width="1200" height="80" fill="#b45309"/>
  <text x="600" y="671" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">POWER THE LIGHT MODULE FROM 3.3V / DO IS NOT USED IN THIS LESSON</text>
  <text x="600" y="701" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffedd5">TEACHING DIAGRAM - NOT A HARDWARE PHOTO OR VERIFIED ADC RESULT</text>
</svg>
