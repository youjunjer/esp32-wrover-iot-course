<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wrover OLED 與數位類比輸入診斷接線</title>
  <desc id="desc">一般模式使用 OLED GPIO21與22、數位輸入GPIO14、類比輸入GPIO33；所有感測器訊號限制在零到3.3伏特。</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">SENSOR INPUT CHECK - GENERAL MODE</text>

  <rect x="70" y="105" width="360" height="470" rx="26" fill="#0f172a"/>
  <text x="250" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">ESP32 Wrover</text>
  <text x="250" y="187" text-anchor="middle" font-family="monospace" font-size="17" fill="#cbd5e1">esp32:esp32:esp32wrover</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">
    <text x="310" y="250">3V3</text><text x="310" y="360">GND</text>
    <text x="276" y="415">GPIO 21</text><text x="276" y="470">GPIO 22</text>
    <text x="276" y="525">GPIO 14</text><text x="276" y="565">GPIO 33</text>
  </g>
  <g fill="#e2e8f0">
    <circle cx="430" cy="243" r="8"/><circle cx="430" cy="353" r="8"/>
    <circle cx="430" cy="408" r="8"/><circle cx="430" cy="463" r="8"/><circle cx="430" cy="518" r="8"/><circle cx="430" cy="558" r="8"/>
  </g>

  <rect x="760" y="92" width="360" height="190" rx="20" fill="#111827" stroke="#2563eb" stroke-width="4"/>
  <text x="940" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">SSD1306 OLED</text>
  <g font-family="monospace" font-size="19" fill="#dbeafe">
    <text x="790" y="177">VCC  3.3V</text><text x="790" y="207">GND  COMMON</text>
    <text x="790" y="237">SDA  GPIO21</text><text x="790" y="267">SCL  GPIO22</text>
  </g>

  <rect x="650" y="330" width="220" height="200" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="760" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#14532d">DIGITAL SOURCE</text>
  <text x="760" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">0 or 3.3V signal</text>
  <g font-family="monospace" font-size="18" fill="#14532d">
    <text x="682" y="455">SIG → GPIO14</text><text x="682" y="487">GND → GND</text>
  </g>

  <rect x="920" y="330" width="220" height="200" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="1030" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7c2d12">ANALOG SOURCE</text>
  <text x="1030" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">0 to 3.3V signal</text>
  <g font-family="monospace" font-size="18" fill="#7c2d12">
    <text x="948" y="455">AO  → GPIO33</text><text x="948" y="487">GND → GND</text>
  </g>

  <path d="M438 243 C560 243 645 157 752 157" fill="none" stroke="#ef4444" stroke-width="6"/>
  <path d="M438 353 C570 353 650 207 752 207" fill="none" stroke="#111827" stroke-width="6"/>
  <path d="M438 408 C560 408 640 237 752 237" fill="none" stroke="#22c55e" stroke-width="6"/>
  <path d="M438 463 C590 463 660 267 752 267" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <path d="M438 518 C525 518 570 442 642 442" fill="none" stroke="#16a34a" stroke-width="6"/>
  <path d="M438 558 C610 558 750 442 912 442" fill="none" stroke="#ea580c" stroke-width="6"/>

  <!-- The white underlay keeps the common-ground bus distinct where it crosses signal routes. -->
  <path d="M438 353 C485 353 470 590 520 590 H1030 M760 590 V530 M1030 590 V530" fill="none" stroke="#f8fafc" stroke-width="14"/>
  <path d="M438 353 C485 353 470 590 520 590 H1030 M760 590 V530 M1030 590 V530" fill="none" stroke="#111827" stroke-width="6"/>
  <circle cx="760" cy="530" r="7" fill="#111827"/>
  <circle cx="1030" cy="530" r="7" fill="#111827"/>
  <text x="625" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">COMMON GND BUS</text>

  <rect x="0" y="620" width="1200" height="80" fill="#b45309"/>
  <text x="600" y="653" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">POWER OFF BEFORE REWIRING / SIGNAL INPUT MUST NOT EXCEED 3.3V</text>
  <text x="600" y="682" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffedd5">TEACHING DIAGRAM - NOT A HARDWARE PHOTO OR VERIFIED WIRING RESULT</text>
</svg>
