<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wrover DHT11 光敏 OLED 與選配 1602 LCD 整合接線</title>
  <desc id="desc">DHT11 DATA 接 GPIO14，光敏模組 AO 接 GPIO33 且 DO 不接，OLED 與 3.3V 相容的選配 1602 LCD 共用 GPIO21 SDA 與 GPIO22 SCL。</desc>
  <rect width="1200" height="720" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">MULTISENSOR - DHT GPIO14 + LIGHT GPIO33 + I2C GPIO21/22</text>
  <rect x="40" y="90" width="310" height="515" rx="24" fill="#0f172a"/><text x="195" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">ESP32 Wrover</text>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff"><text x="235" y="205">3V3</text><text x="235" y="260">GND</text><text x="195" y="315">GPIO 21 SDA</text><text x="195" y="370">GPIO 22 SCL</text><text x="195" y="425">GPIO 14</text><text x="195" y="480">GPIO 33</text></g><g fill="#e2e8f0"><circle cx="350" cy="198" r="7"/><circle cx="350" cy="253" r="7"/><circle cx="350" cy="308" r="7"/><circle cx="350" cy="363" r="7"/><circle cx="350" cy="418" r="7"/><circle cx="350" cy="473" r="7"/></g>
  <rect x="750" y="72" width="390" height="155" rx="20" fill="#111827" stroke="#2563eb" stroke-width="4"/><text x="945" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">SSD1306 OLED - PRIMARY</text><g font-family="monospace" font-size="18" fill="#dbeafe"><text x="785" y="150">3.3V / GND</text><text x="785" y="183">SDA21 / SCL22</text></g>
  <rect x="735" y="250" width="405" height="135" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><rect x="790" y="274" width="105" height="72" rx="10" fill="#60a5fa"/><text x="842" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">DHT11</text><text x="930" y="300" font-family="monospace" font-size="18" fill="#1e3a8a">DATA GPIO14</text><text x="930" y="335" font-family="monospace" font-size="18" fill="#1e3a8a">3.3V / GND</text>
  <rect x="735" y="410" width="405" height="135" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/><circle cx="840" cy="465" r="32" fill="#fde68a" stroke="#92400e" stroke-width="3"/><path d="M840 422v-18M840 526v-18M797 465h-18M901 465h-18" stroke="#f59e0b" stroke-width="5"/><text x="930" y="452" font-family="monospace" font-size="18" fill="#7c2d12">AO GPIO33</text><text x="930" y="487" font-family="monospace" font-size="18" fill="#7c2d12">3.3V / GND</text><text x="930" y="520" font-family="monospace" font-size="18" font-weight="700" fill="#991b1b">DO NOT USE</text>
  <rect x="680" y="565" width="470" height="62" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="915" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">OPTIONAL 1602 LCD: SAME SDA21/SCL22</text><text x="915" y="614" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#14532d">ONLY A VERIFIED 3.3V BACKPACK OR SAFE LEVEL SHIFTER</text>
  <path d="M358 198 C540 198 620 130 742 130" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M358 253 C540 253 620 170 742 170" fill="none" stroke="#111827" stroke-width="6"/><path d="M358 308 C540 308 630 183 742 183" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M358 363 C560 363 650 200 742 200" fill="none" stroke="#f59e0b" stroke-width="6"/><path d="M358 418 C525 418 610 315 727 315" fill="none" stroke="#2563eb" stroke-width="6"/><path d="M358 473 C525 473 610 465 727 465" fill="none" stroke="#f97316" stroke-width="6"/>
  <rect x="0" y="650" width="1200" height="70" fill="#b45309"/><text x="600" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">OLED AND LCD SHARE THE I2C BUS - VERIFY UNIQUE ADDRESSES AND 3.3V-SAFE PULL-UPS</text><text x="600" y="707" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffedd5">DHT DATA GPIO14 / LIGHT AO GPIO33 / POWER OFF BEFORE CHANGING WIRING</text>
</svg>
