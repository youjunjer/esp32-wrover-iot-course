<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">1602 LCD 掃描、成功與錯誤預期畫面</title>
  <desc id="desc">第一格示意 OLED 顯示 LCD SCAN，第二格依 11_lcd1602_dht.ino 顯示 1602 的 T:24.0°C H:55% 與 DHT OK AGE 0s，第三格示意 LCD 缺席時由 OLED 顯示 LCD NO ACK R3s。LCD ACK 只代表 PCF8574 位址回應，不證明 HD44780、對比或實際文字正常；所有內容均非實機與非實測。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/><text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">1602 LCD - EXPECTED STATES</text>
  <g font-family="monospace">
    <g transform="translate(45,105)" fill="#e0f2fe"><rect width="340" height="290" rx="18" fill="#020617" stroke="#38bdf8" stroke-width="6"/><text x="24" y="50" font-size="22">OLED STARTUP</text><line x1="24" y1="66" x2="316" y2="66" stroke="#e0f2fe" stroke-width="2"/><text x="24" y="145" font-size="40" font-weight="700">LCD SCAN</text><text x="24" y="205" font-size="22">TRY 0x27 / 0x3F</text><text x="170" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">scan appears on OLED</text></g>
    <g transform="translate(430,105)" fill="#365314"><rect width="340" height="290" rx="18" fill="#84cc16" stroke="#365314" stroke-width="5"/><rect x="25" y="70" width="290" height="135" fill="#d9f99d" stroke="#4d7c0f" stroke-width="3"/><text x="42" y="120" font-size="24">T:24.0°C H:55%</text><text x="42" y="175" font-size="23">DHT OK AGE 0s</text><text x="170" y="238" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700">LCD ACK 0x27</text><text x="170" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">1602 two-line summary</text></g>
    <g transform="translate(815,105)" fill="#e0f2fe"><rect width="340" height="290" rx="18" fill="#020617" stroke="#fb7185" stroke-width="6"/><text x="24" y="50" font-size="19">DHT11 + LCD1602</text><line x1="24" y1="66" x2="316" y2="66" stroke="#e0f2fe" stroke-width="2"/><text x="24" y="115" font-size="22" fill="#fecdd3">LCD NO ACK R3s</text><text x="24" y="170" font-size="34" font-weight="700">OK</text><text x="24" y="215" font-size="19">T 24.0C  H 55%</text><text x="24" y="250" font-size="18">AGE 0s  ERR 0</text><text x="170" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700">LCD absence appears on OLED</text></g>
  </g>
  <text x="600" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">LCD ACK = PCF8574 replied; not proof of HD44780, contrast or visible text</text>
  <rect x="0" y="520" width="1200" height="100" fill="#9a3412"/><text x="600" y="558" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="700" fill="#fff">非實機／非實測資料</text><text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffedd5">EXPECTED LAYOUT ONLY - 0x27, TEMPERATURE AND HUMIDITY ARE ILLUSTRATIVE</text>
</svg>
