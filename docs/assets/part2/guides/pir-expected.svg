<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PIR 暖機、無移動與偵測移動 OLED 預期畫面</title>
  <desc id="desc">三個示意OLED畫面依序顯示WARMUP、CLEAR與MOTION，事件數字不是實測資料。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">PIR OLED - EXPECTED STATE FLOW</text>
  <g font-family="monospace" fill="#e0f2fe" stroke="#e0f2fe">
    <g transform="translate(45,90)">
      <rect width="340" height="360" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <text x="24" y="45" font-size="24" stroke="none">PIR GPIO14</text><line x1="24" y1="62" x2="316" y2="62" stroke-width="2"/>
      <text x="24" y="150" font-size="43" font-weight="700" stroke="none">WARMUP</text>
      <text x="24" y="220" font-size="26" stroke="none">LEFT 42s</text><text x="24" y="285" font-size="25" stroke="none">RAW LOW</text>
    </g>
    <g transform="translate(430,90)">
      <rect width="340" height="360" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <text x="24" y="45" font-size="24" stroke="none">PIR GPIO14</text><line x1="24" y1="62" x2="316" y2="62" stroke-width="2"/>
      <text x="24" y="150" font-size="48" font-weight="700" stroke="none">CLEAR</text>
      <text x="24" y="220" font-size="26" stroke="none">EVENTS 0</text><text x="24" y="285" font-size="25" stroke="none">RAW LOW</text>
    </g>
    <g transform="translate(815,90)">
      <rect width="340" height="360" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
      <text x="24" y="45" font-size="24" stroke="none">PIR GPIO14</text><line x1="24" y1="62" x2="316" y2="62" stroke-width="2"/>
      <text x="24" y="150" font-size="45" font-weight="700" stroke="none">MOTION</text>
      <text x="24" y="220" font-size="26" stroke="none">EVENTS 1</text><text x="24" y="285" font-size="25" stroke="none">RAW HIGH</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#334155">
    <text x="215" y="492" text-anchor="middle">1. 60-second stabilization</text>
    <text x="600" y="492" text-anchor="middle">2. stable LOW</text>
    <text x="985" y="492" text-anchor="middle">3. stable HIGH for 150 ms</text>
  </g>
  <rect x="0" y="540" width="1200" height="80" fill="#b45309"/>
  <text x="600" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">EXPECTED LAYOUT - NOT A REAL OLED OR PIR TEST PHOTO</text>
  <text x="600" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffedd5">COUNT AND RAW STATES ARE ILLUSTRATIVE, NOT MEASURED DATA</text>
</svg>
