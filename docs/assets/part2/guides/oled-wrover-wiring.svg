<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wrover 與 SSD1306 OLED 一般模式接線</title>
  <desc id="desc">ESP32 Wrover 的 3V3、GND、GPIO21、GPIO22 分別接到 OLED 的 VCC、GND、SDA、SCL。</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">OLED I2C WIRING - GENERAL MODE</text>
  <rect x="80" y="112" width="310" height="320" rx="24" fill="#0f172a"/>
  <text x="235" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">ESP32 Wrover</text>
  <text x="235" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">esp32:esp32:esp32wrover</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    <text x="314" y="244">3V3</text>
    <text x="314" y="296">GND</text>
    <text x="286" y="348">GPIO 21</text>
    <text x="286" y="400">GPIO 22</text>
  </g>
  <g fill="#e2e8f0">
    <circle cx="390" cy="237" r="8"/><circle cx="390" cy="289" r="8"/><circle cx="390" cy="341" r="8"/><circle cx="390" cy="393" r="8"/>
  </g>
  <rect x="570" y="112" width="310" height="340" rx="24" fill="#111827" stroke="#2563eb" stroke-width="5"/>
  <rect x="612" y="146" width="226" height="132" rx="8" fill="#020617" stroke="#60a5fa" stroke-width="3"/>
  <text x="725" y="202" text-anchor="middle" font-family="monospace" font-size="26" font-weight="700" fill="#e0f2fe">SSD1306</text>
  <text x="725" y="240" text-anchor="middle" font-family="monospace" font-size="20" fill="#93c5fd">128 x 64</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    <text x="592" y="330">VCC</text>
    <text x="592" y="365">GND</text>
    <text x="592" y="400">SDA</text>
    <text x="592" y="435">SCL</text>
  </g>
  <g fill="#e2e8f0">
    <circle cx="570" cy="323" r="8"/><circle cx="570" cy="358" r="8"/><circle cx="570" cy="393" r="8"/><circle cx="570" cy="428" r="8"/>
  </g>
  <path d="M398 237 C470 237 500 323 562 323" fill="none" stroke="#ef4444" stroke-width="7"/>
  <path d="M398 289 C470 289 500 358 562 358" fill="none" stroke="#111827" stroke-width="7"/>
  <path d="M398 341 C470 341 500 393 562 393" fill="none" stroke="#22c55e" stroke-width="7"/>
  <path d="M398 393 C470 393 500 428 562 428" fill="none" stroke="#f59e0b" stroke-width="7"/>
  <text x="480" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309">3.3V POWER / SDA 21 / SCL 22</text>
  <text x="480" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">AI Thinker camera mode uses GPIO 21/22 - do not reuse this wiring there.</text>
</svg>
