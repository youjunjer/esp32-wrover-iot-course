<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wrover OLED 與 DHT11 GPIO14 接線</title>
  <desc id="desc">OLED 使用 3.3V、GPIO21 與 GPIO22。DHT11 使用 3.3V，DATA 接 GPIO14；裸感測器加 4.7k 至 10k 上拉，模組版依實際電路確認。</desc>
  <rect width="1200" height="720" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">DHT11 + OLED WIRING - GENERAL MODE</text>
  <rect x="70" y="105" width="380" height="500" rx="26" fill="#0f172a"/><text x="260" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">ESP32 Wrover</text><text x="260" y="188" text-anchor="middle" font-family="monospace" font-size="17" fill="#cbd5e1">DHT data on GPIO14</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff"><text x="325" y="275">3V3</text><text x="325" y="345">GND</text><text x="290" y="415">GPIO 21</text><text x="290" y="485">GPIO 22</text><text x="290" y="555">GPIO 14</text></g><g fill="#e2e8f0"><circle cx="450" cy="268" r="8"/><circle cx="450" cy="338" r="8"/><circle cx="450" cy="408" r="8"/><circle cx="450" cy="478" r="8"/><circle cx="450" cy="548" r="8"/></g>
  <rect x="800" y="88" width="330" height="220" rx="22" fill="#111827" stroke="#2563eb" stroke-width="4"/><text x="965" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">SSD1306 OLED</text><g font-family="monospace" font-size="20" fill="#dbeafe"><text x="840" y="178">VCC ← 3.3V</text><text x="840" y="211">GND ← GND</text><text x="840" y="244">SDA ← GPIO21</text><text x="840" y="277">SCL ← GPIO22</text></g>
  <rect x="745" y="350" width="410" height="255" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><rect x="865" y="380" width="170" height="105" rx="16" fill="#60a5fa" stroke="#1e3a8a" stroke-width="4"/><g stroke="#dbeafe" stroke-width="4"><line x1="890" y1="395" x2="890" y2="470"/><line x1="920" y1="395" x2="920" y2="470"/><line x1="950" y1="395" x2="950" y2="470"/><line x1="980" y1="395" x2="980" y2="470"/><line x1="1010" y1="395" x2="1010" y2="470"/></g><text x="950" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">DHT11</text><g font-family="monospace" font-size="19" fill="#1e3a8a"><text x="785" y="555">VCC ← 3.3V</text><text x="785" y="585">GND ← GND</text><text x="960" y="555">DATA ← GPIO14</text></g>
  <path d="M458 268 C610 268 690 155 792 155" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M458 338 C610 338 680 211 792 211" fill="none" stroke="#111827" stroke-width="6"/><path d="M458 408 C610 408 690 244 792 244" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M458 478 C650 478 720 277 792 277" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <path d="M458 268 C600 268 650 548 737 548" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M458 338 C610 338 650 578 737 578" fill="none" stroke="#111827" stroke-width="6"/><path d="M458 548 C600 548 650 548 737 548" fill="none" stroke="#2563eb" stroke-width="6"/>
  <rect x="470" y="578" width="255" height="43" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="598" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#78350f">BARE DHT: 4.7kΩ-10kΩ PULL-UP</text>
  <rect x="0" y="640" width="1200" height="80" fill="#b45309"/><text x="600" y="671" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">VERIFY SENSOR OR MODULE PIN ORDER - DATA GPIO14 / OLED GPIO21 AND GPIO22</text><text x="600" y="701" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffedd5">POWER OFF BEFORE WIRING / ALL GROUNDS COMMON</text>
</svg>
