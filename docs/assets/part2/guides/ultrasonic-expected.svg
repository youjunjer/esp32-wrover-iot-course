<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">超音波測距成功、逾時與範圍錯誤 OLED 預期畫面</title>
  <desc id="desc">三個示意 OLED 畫面依實際程式顯示 OK 的 DIST 與 ECHO、TIMEOUT 的 NO VALID DIST 與 INVALID，以及 RANGE ERR 的 VALUE 與 OUT OF 2-400。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">ULTRASONIC OLED - EXPECTED STATES</text>
  <g font-family="monospace" fill="#e0f2fe" stroke="#e0f2fe">
    <g transform="translate(45,90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/><text x="24" y="44" font-size="23" stroke="none">ULTRASONIC</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/><text x="24" y="135" font-size="48" font-weight="700" stroke="none">OK</text><text x="24" y="215" font-size="29" stroke="none">DIST 38.4 cm</text><text x="24" y="290" font-size="24" stroke="none">ECHO 2239 us</text></g>
    <g transform="translate(430,90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#f59e0b" stroke-width="5"/><text x="24" y="44" font-size="23" stroke="none">ULTRASONIC</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/><text x="24" y="135" font-size="43" font-weight="700" stroke="none">TIMEOUT</text><text x="24" y="215" font-size="25" stroke="none">NO VALID DIST</text><text x="24" y="290" font-size="23" stroke="none">INVALID 2 / 30ms</text></g>
    <g transform="translate(815,90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#fb7185" stroke-width="5"/><text x="24" y="44" font-size="23" stroke="none">ULTRASONIC</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/><text x="24" y="135" font-size="39" font-weight="700" fill="#fecdd3" stroke="none">RANGE ERR</text><text x="24" y="215" font-size="25" stroke="none">VALUE 415.2 cm</text><text x="24" y="290" font-size="23" stroke="none">OUT OF 2-400</text></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155"><text x="215" y="478" text-anchor="middle">valid pulse and distance</text><text x="600" y="478" text-anchor="middle">zero pulse means timeout</text><text x="985" y="478" text-anchor="middle">outside the 2-400 cm range</text></g>
  <rect x="0" y="520" width="1200" height="100" fill="#9a3412"/><text x="600" y="558" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="700" fill="#fff">非實機／非實測資料</text><text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffedd5">EXPECTED LAYOUT ONLY - DISTANCE AND ECHO TIME ARE ILLUSTRATIVE</text>
</svg>
