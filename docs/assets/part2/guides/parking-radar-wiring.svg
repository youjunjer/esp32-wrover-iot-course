<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wrover 超音波倒車雷達與蜂鳴器模組接線</title>
  <desc id="desc">OLED 使用 GPIO21 與 GPIO22，HC-SR04 使用 TRIG GPIO25；ECHO 經 1% 10kΩ 上臂與 1% 15kΩ 下臂分壓後接 GPIO14，5.0V 名目約 3.00V 且仍須量測。蜂鳴器模組訊號接 GPIO13。</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#0f172a">PARKING RADAR - OLED + HC-SR04 + BUZZER MODULE</text>
  <rect x="45" y="95" width="335" height="515" rx="25" fill="#0f172a"/>
  <text x="212" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#fff">ESP32 Wrover</text>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff"><text x="270" y="215">3V3</text><text x="280" y="265">5V</text><text x="270" y="315">GND</text><text x="225" y="365">GPIO 21</text><text x="225" y="415">GPIO 22</text><text x="225" y="465">GPIO 25</text><text x="225" y="515">GPIO 14</text><text x="225" y="565">GPIO 13</text></g>
  <g fill="#e2e8f0"><circle cx="380" cy="208" r="7"/><circle cx="380" cy="258" r="7"/><circle cx="380" cy="308" r="7"/><circle cx="380" cy="358" r="7"/><circle cx="380" cy="408" r="7"/><circle cx="380" cy="458" r="7"/><circle cx="380" cy="508" r="7"/><circle cx="380" cy="558" r="7"/></g>

  <rect x="785" y="78" width="360" height="175" rx="20" fill="#111827" stroke="#2563eb" stroke-width="4"/>
  <text x="965" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">SSD1306 OLED</text>
  <g font-family="monospace" font-size="19" fill="#dbeafe"><text x="820" y="156">3.3V / GND</text><text x="820" y="188">SDA GPIO21</text><text x="820" y="220">SCL GPIO22</text></g>

  <rect x="680" y="290" width="465" height="205" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <circle cx="790" cy="365" r="47" fill="#94a3b8" stroke="#475569" stroke-width="4"/><circle cx="980" cy="365" r="47" fill="#94a3b8" stroke="#475569" stroke-width="4"/>
  <text x="885" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">HC-SR04</text>
  <text x="700" y="468" font-family="monospace" font-size="15" fill="#1e3a8a">TRIG→25   ECHO→1% 10kΩ→●→14</text>
  <text x="825" y="490" font-family="monospace" font-size="14" fill="#1e3a8a">●→1% 15kΩ→GND  (~3.00V; MEASURE)</text>

  <rect x="705" y="520" width="440" height="100" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
  <circle cx="770" cy="570" r="30" fill="#111827"/><path d="M750 570q20-22 40 0q-20 22-40 0" fill="#fbbf24"/>
  <text x="820" y="557" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#78350f">BUZZER MODULE</text>
  <text x="820" y="588" font-family="monospace" font-size="15" fill="#78350f">SIG→GPIO13 / VCC per module / GND</text>

  <path d="M388 208 C550 208 660 140 777 140" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M388 308 C560 308 680 175 777 175" fill="none" stroke="#111827" stroke-width="6"/><path d="M388 358 C600 358 700 188 777 188" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M388 408 C620 408 720 220 777 220" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <path d="M388 258 C520 258 570 455 672 455" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M388 458 C530 458 585 470 672 470" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M388 508 C525 508 585 482 672 482" fill="none" stroke="#f97316" stroke-width="6"/><path d="M388 558 C520 558 595 570 697 570" fill="none" stroke="#a855f7" stroke-width="6"/>
  <rect x="0" y="640" width="1200" height="80" fill="#b45309"/>
  <text x="600" y="671" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">GPIO13 DRIVES A MODULE SIGNAL ONLY - NEVER DRIVE A HIGH-CURRENT BUZZER DIRECTLY</text>
  <text x="600" y="701" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffedd5">HC-SR04 ECHO STILL REQUIRES A SAFE DIVIDER OR LEVEL SHIFTER</text>
</svg>
