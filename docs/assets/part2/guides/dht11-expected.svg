<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DHT11 等待首次讀取、成功與無資料 OLED 預期畫面</title>
  <desc id="desc">三個 OLED 示意畫面只使用 10_dht11_oled.ino 實際輸出欄位：WAIT 與 FIRST READ 2s、OK 與溫濕度及 AGE／ERR、NO DATA 與 CHECK VCC/DATA/GND 及 ERR。所有數值均非實測。</desc>
  <rect width="1200" height="620" fill="#e2e8f0"/><text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">DHT11 OLED - EXPECTED STATES</text>
  <g font-family="monospace" fill="#e0f2fe" stroke="#e0f2fe">
    <g transform="translate(45,90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#38bdf8" stroke-width="4"/><text x="24" y="44" font-size="24" stroke="none">DHT11 GPIO14</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/><text x="24" y="145" font-size="48" font-weight="700" stroke="none">WAIT</text><text x="24" y="220" font-size="24" stroke="none">FIRST READ 2s</text><text x="24" y="295" font-size="22" stroke="none">ERR 0</text></g>
    <g transform="translate(430,90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#22c55e" stroke-width="5"/><text x="24" y="44" font-size="24" stroke="none">DHT11 GPIO14</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/><text x="24" y="120" font-size="32" stroke="none">OK</text><text x="24" y="190" font-size="27" font-weight="700" stroke="none">T 24.0C 55.0%</text><text x="24" y="260" font-size="23" stroke="none">AGE 0s</text><text x="190" y="260" font-size="23" stroke="none">ERR 0</text></g>
    <g transform="translate(815,90)"><rect width="340" height="350" rx="14" fill="#020617" stroke="#fb7185" stroke-width="5"/><text x="24" y="44" font-size="24" stroke="none">DHT11 GPIO14</text><line x1="24" y1="61" x2="316" y2="61" stroke-width="2"/><text x="24" y="140" font-size="43" font-weight="700" fill="#fecdd3" stroke="none">NO DATA</text><text x="24" y="220" font-size="18" stroke="none">CHECK VCC/DATA/GND</text><text x="24" y="295" font-size="22" stroke="none">ERR 3</text></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#334155"><text x="215" y="478" text-anchor="middle">wait before the first read</text><text x="600" y="478" text-anchor="middle">current data with age and errors</text><text x="985" y="478" text-anchor="middle">show wiring check, not fake values</text></g>
  <rect x="0" y="520" width="1200" height="100" fill="#9a3412"/><text x="600" y="558" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="28" font-weight="700" fill="#fff">非實機／非實測資料</text><text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffedd5">EXPECTED LAYOUT ONLY - TEMPERATURE, HUMIDITY AND ERROR COUNTS ARE ILLUSTRATIVE</text>
</svg>
