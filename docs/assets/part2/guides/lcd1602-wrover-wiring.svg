<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Wrover 與 1602 I2C LCD 安全接線</title>
  <desc id="desc">ESP32 使用 GPIO21 SDA 與 GPIO22 SCL。3.3V 相容背板可直接連接；5V I2C 背板必須經雙向位準轉換器，不可把 5V 上拉直接接到 ESP32。</desc>
  <rect width="1200" height="720" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">1602 I2C LCD WIRING - 3.3V LOGIC SAFE</text>
  <rect x="45" y="115" width="330" height="460" rx="26" fill="#0f172a"/><text x="210" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#fff">ESP32 Wrover</text><text x="210" y="195" text-anchor="middle" font-family="monospace" font-size="16" fill="#cbd5e1">3.3V I2C controller</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff"><text x="245" y="280">3V3</text><text x="245" y="350">GND</text><text x="215" y="420">GPIO 21 SDA</text><text x="215" y="490">GPIO 22 SCL</text></g><g fill="#e2e8f0"><circle cx="375" cy="273" r="8"/><circle cx="375" cy="343" r="8"/><circle cx="375" cy="413" r="8"/><circle cx="375" cy="483" r="8"/></g>

  <rect x="465" y="115" width="270" height="460" rx="26" fill="#fef3c7" stroke="#d97706" stroke-width="5"/><text x="600" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#78350f">SAFE INTERFACE</text>
  <rect x="500" y="210" width="200" height="150" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7c2d12">OPTION A</text><text x="600" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">verified 3.3V</text><text x="600" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7c2d12">compatible backpack</text>
  <text x="600" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#78350f">OR</text>
  <rect x="500" y="420" width="200" height="120" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7c2d12">OPTION B</text><text x="600" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#7c2d12">bidirectional I2C</text><text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#7c2d12">level shifter for 5V</text>

  <rect x="825" y="150" width="330" height="390" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><rect x="865" y="205" width="250" height="115" rx="12" fill="#84cc16" stroke="#365314" stroke-width="4"/><rect x="885" y="225" width="210" height="75" fill="#d9f99d"/><text x="990" y="272" text-anchor="middle" font-family="monospace" font-size="22" fill="#365314">1602 LCD</text><rect x="900" y="355" width="180" height="95" rx="10" fill="#0f766e"/><text x="990" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">I2C BACKPACK</text><text x="990" y="420" text-anchor="middle" font-family="monospace" font-size="17" fill="#ccfbf1">VCC GND SDA SCL</text><g font-family="monospace" font-size="19" fill="#14532d"><text x="865" y="485">SDA ← GPIO21</text><text x="865" y="515">SCL ← GPIO22</text></g>
  <path d="M383 273 C420 273 435 273 457 273" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M383 343 C420 343 435 343 457 343" fill="none" stroke="#111827" stroke-width="6"/><path d="M383 413 C420 413 435 413 457 413" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M383 483 C420 483 435 483 457 483" fill="none" stroke="#f59e0b" stroke-width="6"/><path d="M743 273 C775 273 790 273 817 273" fill="none" stroke="#ef4444" stroke-width="6"/><path d="M743 343 C775 343 790 343 817 343" fill="none" stroke="#111827" stroke-width="6"/><path d="M743 413 C775 413 790 413 817 413" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M743 483 C775 483 790 483 817 483" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <rect x="0" y="630" width="1200" height="90" fill="#b45309"/><text x="600" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">NEVER CONNECT 5V I2C PULL-UPS DIRECTLY TO ESP32 GPIO21 / GPIO22</text><text x="600" y="699" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffedd5">VERIFY BACKPACK VOLTAGE OR USE A BIDIRECTIONAL LEVEL SHIFTER</text>
</svg>
