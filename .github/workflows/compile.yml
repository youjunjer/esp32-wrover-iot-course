name: Compile Arduino examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq

      - name: Set up Node.js for Flow contract checks
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check repository policy
        run: ./scripts/check-policy.sh

      - name: Install ESP32 toolchain
        run: ./scripts/install-toolchain.sh

      - name: Install Arduino libraries
        run: ./scripts/install-libraries.sh

      - name: Compile examples
        run: ./scripts/compile-all.sh

  nodered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nodered/package-lock.json
      - name: Install locked Node-RED environment
        working-directory: nodered
        run: npm ci --no-audit --no-fund
      - name: Exercise public Flows in clean runtimes
        run: node scripts/test-nodered-runtime.mjs
